name: Publish DMG

# Triggered by the `v*` tag that the changesets release workflow pushes after
# the "Version Packages" PR merges. Builds the Tauri app on macOS and uploads
# the resulting .dmg (and .app.tar.gz for updater feeds) to the GitHub
# Release associated with the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach artifacts to (e.g. v0.2.0)"
        required: true

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.rust_target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & publish DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing & notarization are optional. Populate these secrets in the
          # repo to produce a notarized DMG; without them the build still
          # publishes an unsigned DMG that users can open via right-click → Open.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Ghostty Config Editor ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.rust_target }}
