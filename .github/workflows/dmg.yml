name: Publish DMG

# Builds the Tauri app on macOS and uploads the resulting .dmg (and
# .app.tar.gz for updater feeds) to the GitHub Release associated with the
# tag. Invoked by release.yml via `workflow_call` after the "Version
# Packages" PR merges — tag-push events from the default GITHUB_TOKEN do not
# trigger downstream workflows, so we call this one explicitly. The
# `push: tags` trigger still fires for tags pushed by a human with git.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach artifacts to (e.g. v0.2.0)"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and attach artifacts to (e.g. v0.2.0)"
        required: true
        type: string

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.rust_target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & publish DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign: `-` tells codesign to sign with no identity, which
          # avoids the "app is damaged" Gatekeeper message on unsigned
          # downloads. Users still see an "unidentified developer" warning
          # on first open (right-click → Open to bypass). For full Developer
          # ID + notarization, populate the secrets below and uncomment.
          APPLE_SIGNING_IDENTITY: "-"
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Ghostty Config Editor ${{ inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.rust_target }}
